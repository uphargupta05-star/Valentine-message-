<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ishu 💖</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff4e8a,#ffb6c1);
    font-family:Arial, sans-serif;
    overflow:hidden;
    text-align:center;
    color:#fff;
}

/* Card */
.card{
    background:white;
    color:#333;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    z-index:2;
    max-width:360px;
    position:relative;
}

/* Photo */
.photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #ff2e63;
    display:block;
    margin:0 auto 10px;
}

/* Inputs */
.inputs{
    margin-top:8px;
}
input[type="file"]{
    display:block;
    margin:6px auto;
}

/* Buttons */
button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
}
.yes{ background:#ff2e63; color:white; }
.no{ background:#333; color:white; position:absolute; }

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:floatUp 6s linear infinite;
}
@keyframes floatUp{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-110vh); opacity:0;}
}

/* Lyrics */
#lyrics{
    position:fixed;
    bottom:20px;
    width:100%;
    font-size:18px;
    font-weight:bold;
    animation:fade 3s infinite;
}
@keyframes fade{
    0%,100%{opacity:0;}
    50%{opacity:1;}
}
</style>
</head>

<body>

<!-- Default audio uses assets/song.mp3; will be replaced if user selects a file -->
<audio id="bgMusic" loop>
    <source src="assets/song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<div class="card">
    <!-- Default photo uses assets/photo.jpg; will be replaced if user selects a file -->
    <img src="assets/photo.jpg" class="photo" id="photoImg" alt="Ishu">
    <h2>Ishu, Will You Be My Valentine? 💖</h2>
    <p>You make my world beautiful ❤️</p>
    <p><strong>— Uphar</strong></p>

    <div class="inputs">
        <label>
            Change Photo:
            <input type="file" id="photoInput" accept="image/*">
        </label>
        <label>
            Change Song:
            <input type="file" id="songInput" accept="audio/*">
        </label>
    </div>

    <button class="yes" onclick="startLove()">Yes 💘</button>
    <button class="no" id="noBtn">No 😜</button>
</div>

<div id="lyrics"></div>

<script>
// NO button move
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", () => {
    // keep button inside viewport (subtract button size)
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.position = "absolute";
});

// Start everything on YES
function startLove(){
    const bg = document.getElementById("bgMusic");
    // try to play (may be blocked until user interaction; this is a user click so OK)
    bg.play().catch(e => console.warn("Autoplay blocked:", e));
    showLyrics();
}

// Floating hearts
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.style.left=Math.random()*100+"vw";
    heart.innerText="💖";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},300);

// Lyrics animation
const lines=[
"Tenu dil da vaasta ❤️",
"Tu meri jaan ban ja 💖",
"Bin tere lagda na jee 🥹",
"Ishu... be my Valentine 💘"
];
let i=0;
function showLyrics(){
    setInterval(()=>{
        document.getElementById("lyrics").innerText=lines[i%lines.length];
        i++;
    },3000);
}

// Photo file input: preview selected image
const photoInput = document.getElementById("photoInput");
const photoImg = document.getElementById("photoImg");
photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    photoImg.src = url;
    // revoke object URL after image loads to free memory
    photoImg.onload = () => URL.revokeObjectURL(url);
});

// Song file input: replace audio source with selected file
const songInput = document.getElementById("songInput");
const bgMusic = document.getElementById("bgMusic");
songInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);

    // remove existing sources
    while(bgMusic.firstChild) bgMusic.removeChild(bgMusic.firstChild);

    const source = document.createElement("source");
    source.src = url;
    source.type = file.type || "audio/mpeg";
    bgMusic.appendChild(source);

    // load and play (user initiated)
    bgMusic.load();
    bgMusic.play().catch(err => console.warn("Playback blocked:", err));

    // revoke later when audio unloaded
    bgMusic.onended = () => URL.revokeObjectURL(url);
});
</script>

</body>
</html>
